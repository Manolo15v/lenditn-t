# Project name is pinned: the repo directory ("lenditn't") is not a legal
# Compose project name, so Compose would refuse to derive one from it.
name: lendit

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lendit
      POSTGRES_PASSWORD: lendit
      POSTGRES_DB: lendit
    ports:
      # Host 5433 so this never collides with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pg18data:/var/lib/postgresql
    healthcheck:
      # Tilt's resource_deps waits on this, not on "container started".
      test: ["CMD-SHELL", "pg_isready -U lendit -d lendit"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      # Service name, not localhost — this container reaches postgres over the
      # compose network, not the host loopback.
      DATABASE_URL: postgres://lendit:lendit@postgres:5432/lendit
      API_PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
      # Named volumes, not anonymous: an anonymous volume mounted over a
      # directory the image already populated starts empty and hides what
      # pnpm install just built, so tsx/vite come up MODULE_NOT_FOUND.
      - api_node_modules:/repo/node_modules
      - api_app_node_modules:/repo/apps/api/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      - db_pkg_node_modules:/repo/packages/db/node_modules
      - shared_pkg_node_modules:/repo/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      WEB_PORT: 5173
      # Vite's dev-server proxy target — the api container, not localhost.
      API_PORT: 3000
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
      - api_app_node_modules:/repo/apps/api/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      - db_pkg_node_modules:/repo/packages/db/node_modules
      - shared_pkg_node_modules:/repo/packages/shared/node_modules
    depends_on:
      - api

volumes:
  pg18data:
  api_node_modules:
  api_app_node_modules:
  web_app_node_modules:
  db_pkg_node_modules:
  shared_pkg_node_modules:
