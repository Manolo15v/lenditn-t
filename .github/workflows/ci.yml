name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lendit
          POSTGRES_PASSWORD: lendit
          POSTGRES_DB: lendit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lendit -d lendit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      # The API refuses to import without MONGO_URL, so every route suite needs
      # a reachable Mongo even when it never touches item_specs. No init script:
      # service containers start before checkout, so docker/mongo/init cannot be
      # mounted, and the collection is created on first write without the
      # validator.
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: lendit
          MONGO_INITDB_ROOT_PASSWORD: lendit
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 7s
          --health-retries 15

    env:
      DATABASE_URL: postgres://lendit:lendit@localhost:5433/lendit
      REDIS_URL: redis://localhost:6380
      MONGO_URL: mongodb://lendit:lendit@localhost:27018/lendit?authSource=admin

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      # The database-backed suites skip themselves on a developer machine, but
      # never when CI is set — so this step failing turns the build red instead
      # of quietly deleting the cases that matter most.
      - name: Apply schema
        run: pnpm db:push

      - name: Test
        run: pnpm test

      - name: Build client
        run: pnpm --filter @lendit/web build
